# ==========================================
# TaskFlow Continuous Deployment (CD)
# ==========================================
#
# Flow:
#
# GitHub Push
#      ↓
# CI succeeds
#      ↓
# SSH into EC2
#      ↓
# Clone / Update deployment repository
#      ↓
# Create runtime secrets
#      ↓
# Authenticate with GHCR
#      ↓
# Pull Docker images using Git SHA
#      ↓
# docker compose up -d
#      ↓
# Deployment Verification
#      ↓
# /api/db-health → 200
# /api/tasks     → 200
#
# ==========================================

name: TaskFlow CD


# ==========================================
# Workflow Trigger
# ==========================================

on:
  workflow_run:
    workflows: ["TaskFlow CI"]
    types:
      - completed
    branches:
      - main


# ==========================================
# Deployment Job
# ==========================================

jobs:

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Deploy ONLY when CI succeeds
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ------------------------------------------
      # Step 1: Checkout Repository
      # ------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------
      # Step 2: Configure SSH
      # ------------------------------------------

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/taskflow_cd

          chmod 600 ~/.ssh/taskflow_cd

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts


      # ------------------------------------------
      # Step 3: Prepare Deployment Server
      # ------------------------------------------

      - name: Prepare EC2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/taskflow_cd \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'mkdir -p ~/taskflow-production-ready-devops-project/secrets'


      # ------------------------------------------
      # Step 4: Clone / Update Repository
      # ------------------------------------------

      - name: Update Repository
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/taskflow_cd \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            '
              if [ ! -d ~/taskflow-production-ready-devops-project/.git ]; then
                cd ~/taskflow-production-ready-devops-project

                git init
                git remote add origin https://github.com/hridyen/taskflow-production-ready-devops-project.git

                git fetch origin main
                git checkout -B main
                git reset --hard origin/main
              else
                cd ~/taskflow-production-ready-devops-project

                git fetch origin main
                git reset --hard origin/main
              fi  
            '


      # ------------------------------------------
      # Step 5: Create Database Secret
      # ------------------------------------------
      #
      # DB_PASSWORD comes from GitHub Actions Secrets.
      # It is NEVER committed to Git.
      #
      # ------------------------------------------

      - name: Configure Database Secret
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          printf '%s' "$DB_PASSWORD" | \
          ssh -i ~/.ssh/taskflow_cd \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            '
              mkdir -p ~/taskflow-production-ready-devops-project/secrets

              cat > ~/taskflow-production-ready-devops-project/secrets/db_password

              chmod 600 \
                ~/taskflow-production-ready-devops-project/secrets/db_password
            '


      # ------------------------------------------
      # Step 6: Deploy Application
      # ------------------------------------------

      - name: Deploy Application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/taskflow_cd \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "
              cd ~/taskflow-production-ready-devops-project

              export IMAGE_TAG=${IMAGE_TAG}

              docker compose pull

              docker compose up -d
            "


      # ------------------------------------------
      # Step 7: Deployment Verification
      # ------------------------------------------

      - name: Verify Deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Waiting for application to become healthy..."

          sleep 15

          DB_STATUS=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            "http://${DEPLOY_HOST}/api/db-health")

          TASK_STATUS=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            "http://${DEPLOY_HOST}/api/tasks")

          echo "DB Health HTTP Status: ${DB_STATUS}"
          echo "Tasks HTTP Status: ${TASK_STATUS}"

          if [ "$DB_STATUS" != "200" ] || [ "$TASK_STATUS" != "200" ]; then

            echo "Deployment verification failed"

            exit 1

          fi

          echo "Deployment verification passed"