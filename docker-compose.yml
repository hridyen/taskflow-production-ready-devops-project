# ==========================================
# TaskFlow DevOps Orchestration: Docker Compose
# ==========================================
# This file orchestrates four services (Postgres, Backend, Frontend, and Nginx)
# to spin up the local production environment.
# It enforces strict security controls and container boundaries for cloud deployments.

services:

  # ----------------------------------------------------
  # 1. Database Service: Postgres
  # ----------------------------------------------------
  postgres:
    # Use alpine-based official PostgreSQL 17 image to keep the container size small
    image: postgres:17-alpine
    container_name: taskflow-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      # Load password from Docker Secrets file mount instead of storing in plain-text envs
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    volumes:
      # Mount initialization script. Docker automatically runs any .sql script here on first startup
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Persist PostgreSQL data on the host machine across container restarts
      - postgres_data:/var/lib/postgresql/data
    
    secrets:
      - db_password

    # Health check definition: ensures Postgres is fully ready to accept connections
    # before dependent services (like the backend) attempt to start up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ----------------------------------------------------
  # 2. Backend Service: Express Node.js API
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend # Build from the backend directory
      dockerfile: Dockerfile # Use the Dockerfile in the backend directory

    container_name: taskflow-backend
    
    # SECURITY HARDENING: Drop all kernel capabilities (drops root capabilities like chown, kill, etc.)
    cap_drop:
      - ALL
    
    # SECURITY HARDENING: Prevents processes within the container from gaining new permissions
    security_opt:
      - no-new-privileges:true

    # SECURITY HARDENING: Run container filesystem in read-only mode to prevent script injections
    read_only: true
    
    # Mount temporary virtual directory in memory to allow Express to write temp files (needed since FS is read_only)
    tmpfs:
      - /tmp 

    # RESOURCE LIMITS: Boundaries to prevent resource starvation / DOS attacks on host machine
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100

    restart: unless-stopped # Automatically restart container if it crashes (unless manually stopped)

    # Health check definition: checks backend HTTP availability using database health endpoint
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/api/db-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s   

    environment:
      PORT: ${PORT}
      NODE_ENV: production
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      # Load password from Docker Secrets file mount instead of storing in plain-text envs
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      CORS_ORIGIN: ${CORS_ORIGIN}
      
    secrets:
      - db_password

    # Wait for the PostgreSQL health check to pass before starting backend container
    depends_on:
      postgres:
        condition: service_healthy


  # ----------------------------------------------------
  # 3. Frontend Service: Vite / React / Nginx static host
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL} 

    container_name: taskflow-frontend

    # Wait for backend API service to spin up before serving the static assets
    depends_on:
      - backend

  
  # ----------------------------------------------------
  # 4. Reverse Proxy / Gateway Service: Nginx
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx

    # Expose Nginx on port 80 to receive external web traffic
    ports:
      - "80:80"

    volumes:
      # Mount Nginx reverse proxy configuration in read-only mode
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    # Ensure frontend and backend containers exist before proxying traffic
    depends_on:
      - frontend
      - backend

  # ----------------------------------------------------
  # 5. Monitoring Service: Prometheus
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: taskflow-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"
    depends_on:
      - backend
      - node-exporter
      - cadvisor
    restart: unless-stopped

  # ----------------------------------------------------
  # 6. Monitoring Service: Node Exporter
  # ----------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: taskflow-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  # ----------------------------------------------------
  # 7. Monitoring Service: cAdvisor
  # ----------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: taskflow-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  # ----------------------------------------------------
  # 8. Monitoring Service: Grafana
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: taskflow-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ----------------------------------------------------
  # 9. Logging Service: Loki
  # ----------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: taskflow-loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # ----------------------------------------------------
  # 10. Logging Service: Promtail
  # ----------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: taskflow-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped


# ----------------------------------------------------
# Shared Volumes & Secret Definitions
# ----------------------------------------------------
volumes:
  postgres_data: # Database persistent storage volume
  prometheus_data:
  grafana_data:
  loki_data:

secrets:
  db_password:
    # File containing plain-text password, shared securely with postgres and backend containers
    file: ./secrets/db_password