# ==========================================
# TaskFlow Gateway Configuration: Nginx
# ==========================================
# This Nginx configuration acts as a reverse proxy, receiving all incoming traffic
# on port 80 and routing it to the appropriate service (frontend or backend).

events {
    # Specifies maximum number of simultaneous connections per worker process.
    # Default is sufficient for general deployments.
    worker_connections 1024;
}

http {

    # Define backend upstream server groups.
    # Nginx uses Docker's internal DNS to resolve the container name "frontend" to its IP address.
    upstream frontend {
        server frontend:80;
    }

    # Define backend API upstream server groups.
    # Resolves to the Express container running on port 9001.
    upstream backend {
        server backend:9001;
    }

    server {
        # Listen for HTTP connections on port 80
        listen 80;

        # ----------------------------------------------------
        # Route: Static Frontend Assets
        # ----------------------------------------------------
        # Catch-all block routing default root paths to the frontend Nginx server.
        location / {
            proxy_pass http://frontend;
            
            # Pass original client headers to downstream container
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------
        # Route: Backend REST API Endpoints
        # ----------------------------------------------------
        # Explicit location block routing any path starting with /api/ to the Express service.
        location /api/ {
            proxy_pass http://backend;

            # Pass original client headers to ensure the API receives true caller IPs instead of Nginx container IPs
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
